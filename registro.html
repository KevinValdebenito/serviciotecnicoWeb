<body>

    <div class="caja-registro">

        <h1>Registro</h1>
        <p>Registrate en nuestro sistema:</p>
        
        <div class="caja-nombre">
        <label for="input-nombre">Nombre completo:</label>
        <input type="text" id="input-nombre" placeholder="Nombre completo">
        </div> 

        <div class="caja-email">
            <label for="input-email">Correo Electronico:</label>
            <input type="text" id="input-email" placeholder="Email">
        </div>

        <div class="caja-run">
            <label for="input-run">RUN:</label>
            <input type="text" id="input-run" placeholder="RUN">
        </div>

        <div class="caja-fecha">
            <label for="input-fecha">Fecha de nacimiento:</label>
            <input type="date" id="input-fecha" placeholder="Fecha de nacimiento">
        </div>

        <div class="caja-contrasena">
            <label for="input-contrasena">Contraseña:</label>
            <input type="password" id="input-contrasena" placeholder="Contraseña">
        </div>

        <button>Registrar</button>

    </div>

</body>
