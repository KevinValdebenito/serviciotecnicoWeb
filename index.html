<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/index.css" rel="stylesheet">
    <title>Inicio Sesión - Servicio Técnico</title>
</head>

<body>

    <header class="caeza">

        <div class="izquierda-inicio">
            <a href="index.html">Inicio</a>
        </div>

        <div class="logo-centro">
            <a href="index.html">
                <img src="https://cdn.artec3d.com/content-hub-images/3d_models/metal-nut.png?VersionId=v7szyoNHE1v84O4UkUrx5gyUCMAE0GVW"
                    alt="Logo del Servicio Técnico">
            </a>
        </div>

        <nav class="derecha-inicio">
            <a href="inicio-sesion.html">Iniciar Sesión</a>
            <a href="registro.html">Registro</a>
        </nav>

    </header>

    <main>

        <section class="caja-inicio-sesion">

            <h1>Iniciar Sesión</h1>

            <form id="form-login">

                <div class="email-caja">
                    <label for="input-email">Correo Electrónico:</label>
                    <input
                        id="input-email"
                        type="email"
                        placeholder="Ingrese su correo electrónico"
                        autocomplete="email"
                        required>
                </div>

                <div class="password-caja">
                    <label for="input-password">Contraseña:</label>
                    <input
                        id="input-password"
                        type="password"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="boton-login">
                    <button type="button" id="btn-login">Iniciar Sesión</button>
                </div>

                <p id="mensaje-login"></p>

            </form>

            <p class="texto-registro">
                ¿No tienes cuenta?
                <a href="registro.html">Regístrate aquí</a>
            </p>

        </section>

    </main>

    <footer class="pie-web">

        <div class="pie-izq">
            <p>Servicio Técnico</p>
        </div>

        <div class="pie-centro">
            <p>&copy; 2026 Servicio Técnico. Todos los derechos reservados.</p>
        </div>

        <div class="pie-der">
            <p>Contacto: info@serviciotecnico.com</p>
        </div>

    </footer>

    <script src="js/inicio-sesion.js"></script>

</body>

</html>
