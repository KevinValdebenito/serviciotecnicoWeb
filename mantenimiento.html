    <h1>Mantenimiento</h1>

    <div id="seccion.formulario">
        <h2>Solicitud de Evaluacion Tecnica</h2>
        <p>Ingrese tus datos y los sintomas de tu equipo. Te contactaremos en la brevedad posible.</p>

        <div class="campo-formulario">
            <input type="text" id="input-nombre" placeholder="Ej: Juan Perez">
        </div>
        <div class="campo-formulario">
            <input type="email" id="input-email" placeholder="Ej: juan@example.com">
        </div>
        <div class="campo-formulario">
            <input type="tel" id="input-telefono" placeholder="Ej: +123456789">
        </div>
        <div class="campo-formulario">
            <textarea id="input-sintomas" placeholder="Ej: Mi notebook asus no prende la pantalla"></textarea>
        </div>

        <button type="submit" id="btn-enviar-servicio" placeholder="Enviar Solicitud">Enviar Solicitud</button>
    </div>
